[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-connector"
version = "0.1.0"
description = "MCP connector exposing Qobuz search, library, playlists, and Hi-Res streaming to Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "psilosophic" }]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.2",
]

[project.scripts]
qobuz-connector = "qobuz_connector.server:main"

[tool.setuptools.packages.find]
where = ["src"]
